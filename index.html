<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b2d">
  <title>Rock Paper Scissors Stratego</title>
  <style>
    :root {
      --ink: #18263a;
      --muted: #6f7b8a;
      --navy: #101b2d;
      --navy-2: #17263d;
      --cream: #f4f0e7;
      --paper: #fffdf8;
      --line: #ded8cc;
      --grid: #d5cbbb;
      --blue: #2d78d4;
      --blue-soft: #e7f1ff;
      --coral: #eb705d;
      --coral-soft: #fff0ed;
      --gold: #d89d35;
      --shadow: 0 18px 48px rgba(25, 40, 61, .12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      background-image: radial-gradient(circle at 20% 0%, rgba(255,255,255,.8), transparent 33%), radial-gradient(circle at 90% 18%, rgba(229,214,182,.22), transparent 27%), repeating-linear-gradient(0deg, rgba(92,76,45,.018) 0, rgba(92,76,45,.018) 1px, transparent 1px, transparent 4px);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid #80b6ff; outline-offset: 3px; }
    .app-shell { min-height: 100vh; }
    .topbar {
      min-height: 80px;
      padding: 18px clamp(18px, 4vw, 58px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: white;
      border-bottom: 2px solid #c58b2b;
      background: radial-gradient(circle at 12% 0%, rgba(56,92,132,.35), transparent 28%), linear-gradient(135deg, #0d182b, #162840 62%, #101b2d);
      box-shadow: 0 4px 16px rgba(16,27,45,.16);
    }
    .brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .brand-mark {
      position: relative;
      width: 50px; height: 58px; flex: 0 0 auto;
      display: grid; place-items: center;
      color: #fff;
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(145deg, #edc56b, #b87c24);
      clip-path: polygon(50% 0, 100% 10%, 100% 74%, 50% 100%, 0 74%, 0 10%);
      filter: drop-shadow(0 4px 5px rgba(0,0,0,.22));
      isolation: isolate;
    }
    .brand-mark::before { content: ""; position: absolute; z-index: 0; inset: 3px; background: linear-gradient(145deg, #35577e, #172c49 68%, #102238); clip-path: polygon(50% 0, 100% 10%, 100% 74%, 50% 100%, 0 74%, 0 10%); }
    .brand-mark span { position: relative; z-index: 1; font-size: 17px; }
    .brand-copy { min-width: 0; }
    .eyebrow { margin: 0 0 4px; color: #a8b8cb; font-size: 10px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(16px, 2.2vw, 23px); line-height: 1; letter-spacing: -.035em; white-space: nowrap; }
    h1 span { color: #edb45a; }
    .phase-line { margin: 6px 0 0; max-width: min(720px, 62vw); color: #bdcad9; font-size: 11px; line-height: 1.35; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .top-actions button, .link-button {
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px;
      padding: 10px 14px;
      color: #f4f7fb;
      background: rgba(255,255,255,.08);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .top-actions button:hover, .link-button:hover { background: rgba(255,255,255,.16); transform: translateY(-1px); }
    .top-actions .new-button { color: var(--navy); border-color: #e8b15d; background: #e8b15d; font-weight: 800; }
    .top-actions .new-button:hover { background: #f3c475; }
    .top-actions .icon-button {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: #f4f7fb;
      background: transparent;
      font-size: 24px;
      line-height: 1;
    }
    .top-actions .icon-button:hover {
      color: #edb45a;
      background: transparent;
      transform: translateY(-1px);
    }
    .top-actions .icon-button span { display: block; }

    .game-layout {
      width: min(1420px, 100%);
      margin: 0 auto;
      padding: clamp(18px, 3.2vw, 42px) clamp(14px, 4vw, 58px) 45px;
      display: grid;
      grid-template-columns: minmax(0, 650px);
      justify-content: center;
      align-items: start;
      gap: 0;
    }
    .side-column { display: grid; gap: 14px; }
    .panel {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(255,253,248,.98), rgba(249,245,236,.98));
      box-shadow: 0 7px 22px rgba(25,40,61,.055), inset 0 1px rgba(255,255,255,.9);
    }
    .panel-label { margin: 0 0 13px; color: #657183; font-family: Georgia, "Times New Roman", serif; font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .turn-card { position: relative; overflow: hidden; background: linear-gradient(135deg, #eaf3ff 0%, #f8fbff 42%, #fffdf8 100%); }
    .turn-card::after { content: ""; position: absolute; width: 90px; height: 90px; right: -40px; top: -42px; border-radius: 50%; background: var(--blue-soft); }
    .turn-player { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 24px; font-weight: 700; letter-spacing: -.04em; }
    .turn-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .player-dot { display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; background: var(--blue); vertical-align: 2px; }
    .player-dot.p2 { background: var(--coral); }
    .stat-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid #ece9e1; font-size: 13px; }
    .stat-line:last-child { border-bottom: 0; padding-bottom: 0; }
    .stat-line:first-of-type { padding-top: 0; }
    .stat-line strong { font-size: 16px; }
    .inventory { display: grid; gap: 9px; }
    .inventory-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #536072; font-size: 12px; }
    .inventory-name { display: flex; align-items: center; gap: 8px; }
    .mini-symbol { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 7px; color: white; font-size: 11px; font-weight: 900; }
    .mini-symbol.rock, .piece.rock { --piece-color: #566579; --piece-light: #e6ebf0; }
    .mini-symbol.paper, .piece.paper { --piece-color: #2878cf; --piece-light: #e6f1ff; }
    .mini-symbol.scissors, .piece.scissors { --piece-color: #d36351; --piece-light: #ffebe7; }
    .mini-symbol.flag, .piece.flag { --piece-color: #d69a2e; --piece-light: #fff3d9; }
    .mini-symbol.rock { background: #566579; } .mini-symbol.paper { background: #2878cf; }
    .mini-symbol.scissors { background: #d36351; } .mini-symbol.flag { background: #d69a2e; }
    .history { max-height: 245px; overflow: auto; }
    .history-list { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
    .history-list li { display: grid; grid-template-columns: 25px 1fr; gap: 8px; color: #667180; font-size: 11px; line-height: 1.35; }
    .history-number { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 7px; color: #7d8794; background: #f0eee9; font-size: 10px; font-weight: 800; }
    .history-empty { color: #9da5ae; font-size: 12px; }

    .board-column { width: 100%; min-width: 0; }
    .board-heading { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 0 4px 13px; }
    .board-heading h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(20px, 3vw, 29px); letter-spacing: -.045em; }
    .board-heading p { margin: 0; color: var(--muted); font-size: 12px; text-align: right; }
    .phase-banner { margin: 0 0 13px; padding: 14px 17px; border: 1px solid rgba(216,157,53,.45); border-radius: 14px; background: linear-gradient(135deg, #fff5dd, #f3eee3); box-shadow: 0 7px 18px rgba(25,40,61,.06), inset 0 1px rgba(255,255,255,.8); }
    .phase-banner .panel-label { margin-bottom: 5px; color: #9b6d22; }
    .phase-banner h2 { margin: 0; color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-size: clamp(19px, 3vw, 25px); letter-spacing: -.04em; }
    .phase-banner p:last-child { margin: 5px 0 0; color: #6d6f6a; font-size: 12px; line-height: 1.45; }
    .board-frame { padding: 12px; border: 1px solid rgba(216,157,53,.45); border-radius: 23px; background: linear-gradient(145deg, #0d1b2f, #1c3553); box-shadow: 0 18px 48px rgba(25,40,61,.16), inset 0 1px rgba(255,255,255,.18); }
    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(6, minmax(58px, 1fr));
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border: 2px solid #d5aa5a;
      border-radius: 15px;
      background: #dbe1e5;
    }
    .cell {
      position: relative;
      z-index: 2;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--grid);
      padding: 0;
      display: grid;
      place-items: center;
      background: #f3f0e8;
      cursor: pointer;
      transition: background .18s, box-shadow .18s;
    }
    .cell:hover { background: #f5f2eb; }
    .cell.neutral { background: linear-gradient(135deg, #d5e3e7, #e3edf0); }
    .cell.neutral::after { content: ""; position: absolute; inset: 7px; border: 1px dashed rgba(86,107,111,.18); border-radius: 8px; pointer-events: none; }
    .cell.own-zone { box-shadow: inset 0 0 26px rgba(255,255,255,.16); }
    .cell.opponent-zone { box-shadow: inset 0 0 22px rgba(82,66,44,.035); }
    .cell.zone-p1 { background: linear-gradient(135deg, #b9d6df, #cce3e8); box-shadow: inset 0 0 26px rgba(67,129,154,.14); }
    .cell.zone-p2 { background: linear-gradient(135deg, #e8c5c2, #f2d7d1); box-shadow: inset 0 0 26px rgba(178,82,72,.12); }
    .cell.selected { background: #dcecff; box-shadow: inset 0 0 0 3px var(--blue); z-index: 1; }
    .cell.legal-move { background: #e3f2e5; box-shadow: inset 0 0 0 3px #65ae73; }
    .cell.legal-attack { background: #fff0d5; box-shadow: inset 0 0 0 3px var(--gold); }
    .cell.rubble, .cell.rubble:hover { background: linear-gradient(135deg, #c6c6c0, #e1ded4); cursor: not-allowed; box-shadow: inset 0 0 0 2px rgba(86,85,77,.28); }
    .rubble-art { position: relative; z-index: 1; width: 94%; height: 94%; object-fit: contain; filter: drop-shadow(0 8px 6px rgba(20,35,53,.3)); pointer-events: none; }
    .cell.high-ground { overflow: visible; border: 0; border-radius: 0; }
    .cell.terrain-cell { cursor: pointer; }
    .cell.terrain-cell:hover { box-shadow: inset 0 0 0 3px rgba(216,157,53,.54); }
    .high-ground-art { display: none; }
    .terrain-layer { position: absolute; z-index: 1; inset: 0; overflow: hidden; pointer-events: none; }
    .terrain-layer svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .terrain-edge-shadow { fill: none; stroke: #49351f; stroke-width: 10; stroke-linecap: round; opacity: .7; }
    .terrain-edge-highlight { fill: none; stroke: #c2d56d; stroke-width: 3; stroke-linecap: round; opacity: .72; }
    .cell.selected::before { content: "SELECTED"; position: absolute; top: 5px; left: 7px; color: var(--blue); font-size: 7px; font-weight: 900; letter-spacing: .1em; }
    .piece {
      position: relative;
      width: min(94%, 104px);
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border: 0;
      border-radius: 0;
      color: var(--piece-color);
      background: transparent;
      box-shadow: none;
      font-weight: 900;
      transform: translateY(0);
      transition: transform .18s, box-shadow .18s;
      pointer-events: none;
    }
    .piece::before { display: none; }
    .piece-glyph { position: relative; font-size: clamp(20px, 4vw, 34px); line-height: .85; letter-spacing: -.1em; }
    .piece-art { position: relative; z-index: 1; width: 98%; height: 94%; object-fit: contain; filter: drop-shadow(0 8px 6px rgba(20,35,53,.3)); }
    .piece-label { position: relative; font-size: clamp(8px, 1vw, 10px); letter-spacing: .12em; }
    .piece:not(.hidden) .piece-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .piece.hidden {
      --piece-color: #aeb7bf; --piece-light: #52637a;
      width: min(75%, 76px);
      border: 2px solid #8999ad;
      border-radius: 11px;
      color: white;
      background: repeating-linear-gradient(135deg, #435770 0, #435770 5px, #526780 5px, #526780 10px);
      box-shadow: 0 4px 9px rgba(20,35,53,.13), inset 0 1px rgba(255,255,255,.18);
    }
    .piece.hidden.owner-p1 { background: repeating-linear-gradient(135deg, #385e88 0, #385e88 5px, #4d739b 5px, #4d739b 10px); }
    .piece.hidden.owner-p2 { background: repeating-linear-gradient(135deg, #8a4f4c 0, #8a4f4c 5px, #a8665e 5px, #a8665e 10px); }
    .piece.hidden .piece-glyph { font-size: clamp(19px, 3.5vw, 29px); }
    .piece.hidden .piece-label { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .piece.known .piece-art { filter: drop-shadow(0 8px 6px rgba(20,35,53,.3)) drop-shadow(0 0 2px rgba(216,157,53,.75)); }
    .piece.known::before { display: none; }
    .piece.known::after { content: "👁️"; position: absolute; z-index: 4; top: -5px; right: -5px; width: auto; height: auto; border: 0; background: transparent; box-shadow: none; font-size: 17px; line-height: 1; transform: rotate(-8deg); }
    .piece.setup-selected { transform: translateY(-5px) rotate(-2deg); box-shadow: 0 9px 14px rgba(20,35,53,.2), 0 0 0 3px #e6b258; }
    .cell:hover .piece { transform: translateY(-2px); }
    .tray { display: flex; flex-wrap: wrap; justify-content: center; column-gap: 24px; row-gap: 9px; }
    .tray-piece {
      width: 58px; height: 58px; padding: 0; display: grid; place-items: center;
      border: 0; border-radius: 50%;
      color: var(--piece-color); background: transparent; cursor: pointer;
      transition: transform .18s, box-shadow .18s;
    }
    .tray-piece:hover { transform: translateY(-3px); }
    .tray-piece.selected { box-shadow: 0 0 0 3px #e6b258; transform: translateY(-4px); }
    .tray-piece .piece { width: 100%; height: 100%; border: 0; box-shadow: none; background: transparent; }
    .tray-piece .piece-art { width: 100%; height: 100%; }
    .tray-piece .piece-glyph { font-size: 25px; }
    .tray-piece .piece-label { font-size: 8px; }
    .primary-button, .secondary-button {
      border-radius: 10px; padding: 11px 12px; cursor: pointer; font-weight: 800; font-size: 12px; transition: transform .18s, opacity .18s, background .18s;
    }
    .primary-button { border: 1px solid #2469b6; color: white; background: linear-gradient(145deg, #3a86de, #2569b9); box-shadow: 0 6px 14px rgba(45,120,212,.18); }
    .primary-button:hover:not(:disabled) { background: linear-gradient(145deg, #4a94e9, #1f68c2); transform: translateY(-1px); }
    .primary-button:disabled { opacity: .42; cursor: not-allowed; }
    .secondary-button { border: 1px solid var(--line); color: #566477; background: white; }
    .secondary-button:hover { background: #f5f7fa; transform: translateY(-1px); }
    .message-box { min-height: 70px; padding: 15px; border-radius: 13px; color: #596575; background: #f0f3f3; font-size: 12px; line-height: 1.5; }
    .message-box strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 13px; }
    .legend { display: grid; gap: 9px; }
    .legend-row { display: flex; align-items: center; gap: 9px; color: #687585; font-size: 11px; }
    .legend-swatch { width: 20px; height: 20px; flex: 0 0 auto; border-radius: 6px; }
    .legend-swatch.move { border: 2px solid #65ae73; background: #e3f2e5; }
    .legend-swatch.attack { border: 2px solid var(--gold); background: #fff0d5; }
    .legend-swatch.hidden { border: 1px solid #8999ad; background: #52637a; }
    .legend-swatch.known { border: 2px solid #d89d35; background: #fff3d9; }
    .bottom-note { margin: 16px 0 0; color: #a0a5a5; font-size: 10px; line-height: 1.5; text-align: center; }

    .overlay {
      position: fixed; inset: 0; z-index: 20; padding: 20px;
      display: grid; place-items: center;
      background: rgba(16,27,45,.94);
      animation: fade-in .2s ease-out;
    }
    .pass-card { width: min(470px, 100%); padding: clamp(27px, 6vw, 50px); border: 1px solid rgba(255,255,255,.15); border-radius: 24px; color: white; background: #1a2b45; box-shadow: 0 30px 90px rgba(0,0,0,.3); text-align: center; }
    .pass-icon { width: 72px; height: 72px; margin: 0 auto 22px; display: grid; place-items: center; border: 1px solid rgba(232,177,93,.6); border-radius: 21px; color: #e8b15d; background: rgba(232,177,93,.1); font-size: 30px; font-weight: 900; }
    .pass-card .eyebrow { color: #a9b8cb; }
    .pass-card h2 { margin: 0; font-size: clamp(26px, 5vw, 39px); line-height: 1.04; letter-spacing: -.06em; }
    .pass-card p { max-width: 330px; margin: 15px auto 28px; color: #bdc9d7; font-size: 14px; line-height: 1.55; }
    .pass-card .primary-button { width: 100%; padding: 14px; color: var(--navy); border-color: #e8b15d; background: #e8b15d; font-size: 13px; }
    .pass-card .primary-button:hover { background: #f3c475; }
    .mode-actions { display: grid; gap: 10px; }
    .pass-card .secondary-button { width: 100%; color: #e4ebf4; border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.08); }
    .pass-card .secondary-button:hover { color: white; border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.15); }
    .thinking-dots { display: flex; justify-content: center; gap: 6px; margin-top: 20px; }
    .thinking-dots span { width: 7px; height: 7px; border-radius: 50%; background: #edb45a; animation: thinking 1s infinite ease-in-out; }
    .thinking-dots span:nth-child(2) { animation-delay: .15s; }
    .thinking-dots span:nth-child(3) { animation-delay: .3s; }
    .pass-card .winner { margin-bottom: 6px; color: #edb45a; font-size: 12px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; }
    .mode-select-card .pass-icon { position: relative; width: 94px; height: 108px; border: 0; border-radius: 0; color: #f0b653; background: linear-gradient(145deg, #e9b34f, #a96c1f); clip-path: polygon(50% 0, 94% 11%, 94% 75%, 50% 100%, 6% 75%, 6% 11%); isolation: isolate; }
    .mode-select-card .pass-icon::before { content: ""; position: absolute; z-index: -1; inset: 3px; background: linear-gradient(145deg, #29476b, #132743); clip-path: polygon(50% 0, 94% 11%, 94% 75%, 50% 100%, 6% 75%, 6% 11%); }
    .mode-select-card .pass-icon span { position: relative; z-index: 1; font-size: 27px; letter-spacing: -.08em; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { 0% { transform: scale(.96); opacity: .5; } 100% { transform: scale(1); opacity: 1; } }
    @keyframes burst-core { 0% { opacity: .75; transform: translate(-50%, -50%) scale(.35); } 42% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 100% { opacity: .9; transform: translate(-50%, -50%) scale(.9); } }
    @keyframes burst-ray { 0% { opacity: 0; transform: translate(-50%, -100%) rotate(var(--ray-angle)) scaleY(.12); } 35% { opacity: 1; } 100% { opacity: .65; transform: translate(-50%, -100%) rotate(var(--ray-angle)) scaleY(1); } }
    @keyframes burst-orb { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); } 45% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: .75; transform: translate(-50%, -50%) scale(.82); } }
    @keyframes burst-fade { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: .92; } }
    @keyframes capture-board-shake { 0%, 100% { transform: translate(0, 0); } 12% { transform: translate(-3px, 2px); } 25% { transform: translate(4px, -2px); } 38% { transform: translate(-3px, -1px); } 51% { transform: translate(2px, 2px); } 64% { transform: translate(-1px, -1px); } }
    @keyframes capture-burst-core { 0% { opacity: .4; transform: translate(-50%, -50%) scale(.18); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.28); } 44% { opacity: 1; transform: translate(-50%, -50%) scale(.94); } 100% { opacity: .88; transform: translate(-50%, -50%) scale(1.08); } }
    @keyframes capture-burst-ray { 0% { opacity: 0; transform: translate(-50%, -100%) rotate(var(--ray-angle)) scaleY(.05); } 22% { opacity: 1; } 48% { opacity: .95; } 100% { opacity: .18; transform: translate(-50%, -100%) rotate(var(--ray-angle)) scaleY(1); } }
    @keyframes capture-burst-ring { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); } 25% { opacity: .95; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.35); } }
    @keyframes capture-burst-shard { 0% { opacity: 0; transform: translate(-50%, -100%) rotate(0deg) scale(.2); } 22% { opacity: 1; } 100% { opacity: .12; transform: translate(-50%, -100%) rotate(var(--shard-angle)) translateY(var(--shard-distance)) scale(.55); } }
    @keyframes capture-burst-flash { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.2); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); } }

<body>
  <div id="app" class="app-shell"></div>

  <script>
    "use strict";

    const BOARD_ROWS = 6;
    const BOARD_COLS = 4;
    const TYPES = ["rock", "paper", "scissors", "flag"];
    const MOBILE_TYPES = ["rock", "paper", "scissors"];
    const TYPE_META = {
      rock: { name: "Rock", glyph: "R", short: "R" },
      paper: { name: "Paper", glyph: "P", short: "P" },
      scissors: { name: "Scissors", glyph: "S", short: "S" },
      flag: { name: "Flag", glyph: "⚑", short: "F" }
    };
    const PIECE_ASSETS = {
      rock: {
        blue: ["rock-blue-1", "rock-blue-2", "rock-blue-3"],
        red: ["rock-red-1", "rock-red-2", "rock-red-3"]
      },
      paper: {
        blue: ["paper", "paper-2", "paper-3"],
        red: ["paper-red-1", "paper-red-2", "paper-red-3"]
      },
      scissors: {
        blue: ["scissors-blue-1", "scissors-blue-2", "scissors-blue-3"],
        red: ["scissors", "scissors-2", "scissors-3"]
      },
      flag: {
        blue: ["flag-blue-1", "flag-blue-2", "flag-blue-3"],
        red: ["flag", "flag-2", "flag-3"]
      }
    };
    const beats = { rock: "scissors", scissors: "paper", paper: "rock" };
    const HIGH_GROUND_ASSETS = {
      0: "high-ground-0000.png",
      1: "high-ground-1000.png",
      3: "high-ground-1100.png",
      5: "high-ground-1010.png",
      7: "high-ground-1110.png",
      15: "high-ground-1111.png"
    };
    const app = document.getElementById("app");

    let state;

    function createPiece(owner, index, type) {
      return {
        id: `p${owner}-${index}`,
        owner,
        type,
        variant: variantForPiece(owner, type, index),
        row: null,
        col: null,
        alive: true,
        revealedTo: { 1: false, 2: false }
      };
    }

    function variantForPiece(owner, type, index) {
      if (type === null || index === 8) return owner === 1 ? 3 : 1;
      const ordinal = type === "rock" ? index - 1 : type === "paper" ? index - 3 : type === "scissors" ? index - 5 : 0;
      const startingVariant = owner === 1 ? 1 : 2;
      return ((startingVariant + ordinal - 1) % 3) + 1;
    }

    function pieceAsset(piece) {
      const palette = piece.owner === 1 ? "blue" : "red";
      const variant = Math.max(1, Math.min(3, piece.variant || 1));
      return `assets/${PIECE_ASSETS[piece.type][palette][variant - 1]}.png`;
    }

    function initializeGame() {
      if (computerCombatTimer) {
        clearTimeout(computerCombatTimer);
        computerCombatTimer = null;
      }
      if (moveAnimationTimer) {
        clearTimeout(moveAnimationTimer);
        moveAnimationTimer = null;
      }
      if (terrainComputerTimer) {
        clearTimeout(terrainComputerTimer);
        terrainComputerTimer = null;
      }
      state = {
        phase: "mode-select",
        gameMode: null,
        aiPlayer: 2,
        terrainPlayer: 1,
        setupPlayer: 1,
        currentPlayer: 1,
        selectedId: null,
        setupSelectedId: null,
        lastCombatWinnerId: null,
        extraChoice: { 1: null, 2: null },
        pieces: [],
        combat: null,
        highGroundCells: [],
        rubbleCells: [],
        moveAnimation: null,
        winner: null,
        turnNumber: 1,
        history: [],
        message: "Choose a mode to begin. Both armies will be placed randomly."
      };
      [1, 2].forEach(owner => {
        const types = ["rock", "rock", "paper", "paper", "scissors", "scissors", "flag", null];
        types.forEach((type, index) => state.pieces.push(createPiece(owner, index + 1, type)));
      });
      const flagVariants = [1, 2, 3].sort(() => Math.random() - 0.5);
      piecesOf(1).find(piece => piece.type === "flag").variant = flagVariants[0];
      piecesOf(2).find(piece => piece.type === "flag").variant = flagVariants[1];
      render();
    }

    function pieceById(id) { return state.pieces.find(piece => piece.id === id); }
    function piecesOf(owner) { return state.pieces.filter(piece => piece.owner === owner); }
    function alivePiecesOf(owner) { return piecesOf(owner).filter(piece => piece.alive); }
    function isInside(row, col) { return row >= 0 && row < BOARD_ROWS && col >= 0 && col < BOARD_COLS; }
    function pieceAt(row, col) { return state.pieces.find(piece => piece.alive && piece.row === row && piece.col === col); }
    function terrainKey(row, col) { return `${row}-${col}`; }
    function isHighGroundCell(row, col, cells = state.highGroundCells) { return cells.includes(terrainKey(row, col)); }
    function toggleHighGroundCell(row, col, cells = state.highGroundCells) {
      const key = terrainKey(row, col);
      const index = cells.indexOf(key);
      if (index === -1) cells.push(key);
      else cells.splice(index, 1);
      return index === -1;
    }
    function rubbleKey(row, col) { return `${row}-${col}`; }
    function isRubbleCell(row, col) { return state.rubbleCells.includes(rubbleKey(row, col)); }
    function addRubble(row, col) { if (!isRubbleCell(row, col)) state.rubbleCells.push(rubbleKey(row, col)); }
    function ownRows(owner) { return owner === 1 ? [4, 5] : [0, 1]; }
    function isHomeSquare(owner, row) { return ownRows(owner).includes(row); }
    function typeName(type) { return TYPE_META[type]?.name || "Unknown"; }
    function opponent(owner) { return owner === 1 ? 2 : 1; }

    function chooseGameMode(mode) {
      state.gameMode = mode;
      state.phase = "terrain-setup";
      state.terrainPlayer = 1;
      state.highGroundCells = [];
      state.message = "Player 1, choose a tile to toggle high ground. Each choice passes terrain setup to the other player. Click outside the board when you are ready for random formations.";
      render();
    }

    function finishTerrainSetup() {
      if (state.phase !== "terrain-setup") return;
      randomizeArmies();
      state.phase = "setup";
      state.setupPlayer = 1;
      state.currentPlayer = 1;
      state.message = "Formations are random. Select two of your pieces to swap them, or select a piece and an empty adjacent square to start the game.";
      render();
    }

    function randomizeArmy(owner) {
      const extraType = MOBILE_TYPES[Math.floor(Math.random() * MOBILE_TYPES.length)];
      state.extraChoice[owner] = extraType;
      const extra = piecesOf(owner).find(piece => piece.type === null);
      if (extra) {
        extra.type = extraType;
        extra.variant = variantForPiece(owner, extraType, 8);
      }
      const flag = piecesOf(owner).find(piece => piece.type === "flag");
      const backRow = owner === 1 ? ownRows(owner)[1] : ownRows(owner)[0];
      const flagCol = Math.floor(Math.random() * BOARD_COLS);
      flag.row = backRow;
      flag.col = flagCol;
      const squares = ownRows(owner)
        .flatMap(row => [0, 1, 2, 3].map(col => ({ row, col })))
        .filter(square => !(square.row === backRow && square.col === flagCol));
      for (let i = squares.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [squares[i], squares[j]] = [squares[j], squares[i]];
      }
      piecesOf(owner).filter(piece => piece !== flag).forEach((piece, index) => { piece.row = squares[index].row; piece.col = squares[index].col; });
    }

    function randomizeArmies() {
      [1, 2].forEach(randomizeArmy);
      state.setupSelectedId = null;
      const flagVariants = [1, 2, 3].sort(() => Math.random() - 0.5);
      piecesOf(1).find(piece => piece.type === "flag").variant = flagVariants[0];
      piecesOf(2).find(piece => piece.type === "flag").variant = flagVariants[1];
    }

    function neighboringCells(row, col) {
      return [[row - 1, col], [row, col + 1], [row + 1, col], [row, col - 1]].filter(([nextRow, nextCol]) => isInside(nextRow, nextCol));
    }

    function highGroundComponentSize(row, col, cells = state.highGroundCells) {
      if (!isHighGroundCell(row, col, cells)) return 0;
      const visited = new Set();
      const queue = [[row, col]];
      while (queue.length) {
        const [currentRow, currentCol] = queue.shift();
        const key = terrainKey(currentRow, currentCol);
        if (visited.has(key) || !isHighGroundCell(currentRow, currentCol, cells)) continue;
        visited.add(key);
        neighboringCells(currentRow, currentCol).forEach(([nextRow, nextCol]) => {
          if (!visited.has(terrainKey(nextRow, nextCol)) && isHighGroundCell(nextRow, nextCol, cells)) queue.push([nextRow, nextCol]);
        });
      }
      return visited.size;
    }

    function largestHighGroundComponent(cells = state.highGroundCells) {
      return cells.reduce((largest, key) => {
        const [row, col] = key.split("-").map(Number);
        return Math.max(largest, highGroundComponentSize(row, col, cells));
      }, 0);
    }

    function highGroundBonus(piece) {
      if (!piece || !isHighGroundCell(piece.row, piece.col)) return 0;
      return Math.min(highGroundComponentSize(piece.row, piece.col) * 0.2, 0.8);
    }

    function terrainAdvantage(attacker, defender) {
      const attackerBonus = highGroundBonus(attacker);
      const defenderBonus = highGroundBonus(defender);
      if (attackerBonus && !defenderBonus) return { side: "attacker", owner: attacker.owner, chance: attackerBonus };
      if (defenderBonus && !attackerBonus) return { side: "defender", owner: defender.owner, chance: defenderBonus };
      return null;
    }

    function determineCombat(attacker, defender) {
      if (defender.type === "flag") return { outcome: "capture", terrainOwner: null, terrainChance: 0, terrainRollSucceeded: false };
      const advantage = terrainAdvantage(attacker, defender);
      const terrainRollSucceeded = Boolean(advantage && Math.random() < advantage.chance);
      if (terrainRollSucceeded) {
        return { outcome: advantage.side, terrainOwner: advantage.owner, terrainChance: advantage.chance, terrainRollSucceeded: true };
      }
      const outcome = attacker.type === defender.type ? "draw" : beats[attacker.type] === defender.type ? "attacker" : "defender";
      return {
        outcome,
        terrainOwner: advantage?.owner || null,
        terrainChance: advantage?.chance || 0,
        terrainRollSucceeded: false
      };
    }

    function terrainMask(row, col) {
      let mask = 0;
      if (isHighGroundCell(row - 1, col)) mask |= 1;
      if (isHighGroundCell(row, col + 1)) mask |= 2;
      if (isHighGroundCell(row + 1, col)) mask |= 4;
      if (isHighGroundCell(row, col - 1)) mask |= 8;
      return mask;
    }

    function rotateTerrainMask(mask) {
      return ((mask << 1) | (mask >> 3)) & 15;
    }

    function highGroundAsset(row, col) {
      const mask = terrainMask(row, col);
      let canonicalMask = 16;
      let turnsToCanonical = 0;
      let rotatedMask = mask;
      for (let turns = 0; turns < 4; turns += 1) {
        if (rotatedMask < canonicalMask) {
          canonicalMask = rotatedMask;
          turnsToCanonical = turns;
        }
        rotatedMask = rotateTerrainMask(rotatedMask);
      }
      return {
        asset: HIGH_GROUND_ASSETS[canonicalMask],
        rotation: ((4 - turnsToCanonical) % 4) * 90
      };
    }

    function terrainMarkup(row, col) {
      if (!isHighGroundCell(row, col)) return "";
      const { asset, rotation } = highGroundAsset(row, col);
      return `<img class="high-ground-art" src="assets/${asset}" alt="" style="--terrain-rotation:${rotation}deg">`;
    }

    function hypotheticalTerrain(row, col) {
      const cells = state.highGroundCells.slice();
      toggleHighGroundCell(row, col, cells);
      return cells;
    }

    function chooseComputerTerrainCell() {
      let bestScore = -Infinity;
      let bestCells = [];
      for (let row = 0; row < BOARD_ROWS; row += 1) {
        for (let col = 0; col < BOARD_COLS; col += 1) {
          const cells = hypotheticalTerrain(row, col);
          const centerDistance = Math.abs(row - (BOARD_ROWS - 1) / 2) + Math.abs(col - (BOARD_COLS - 1) / 2);
          const centerScore = 1 - centerDistance / (BOARD_ROWS + BOARD_COLS);
          const score = largestHighGroundComponent(cells) * 100 + highGroundComponentSize(row, col, cells) * 4 + centerScore;
          if (score > bestScore) {
            bestScore = score;
            bestCells = [{ row, col }];
          } else if (score === bestScore) {
            bestCells.push({ row, col });
          }
        }
      }
      return bestCells[Math.floor(Math.random() * bestCells.length)];
    }

    function runComputerTerrainTurn() {
      if (state.phase !== "terrain-ai-thinking" || state.terrainPlayer !== state.aiPlayer) return;
      terrainComputerTimer = null;
      const choice = chooseComputerTerrainCell();
      toggleHighGroundCell(choice.row, choice.col);
      state.terrainPlayer = 1;
      state.phase = "terrain-setup";
      state.message = "Player 1, choose the next terrain tile, or click outside the board to start random formations.";
      render();
    }

    function handleTerrainCell(row, col) {
      if (state.phase !== "terrain-setup") return;
      const added = toggleHighGroundCell(row, col);
      const action = added ? "High ground added" : "Tile returned to plain";
      state.terrainPlayer = opponent(state.terrainPlayer);
      if (state.gameMode === "computer" && state.terrainPlayer === state.aiPlayer) {
        state.phase = "terrain-ai-thinking";
        state.message = `${action}. Player 2 is choosing the next terrain tile.`;
        render();
        terrainComputerTimer = setTimeout(runComputerTerrainTurn, 700);
        return;
      }
      state.message = `${action}. Player ${state.terrainPlayer}, choose a tile, or click outside the board to start random formations.`;
      render();
    }

    function beginPass() {
      if (state.phase === "turn-pass") {
        state.phase = "playing";
        const survivor = state.lastCombatWinnerId ? pieceById(state.lastCombatWinnerId) : null;
        if (survivor && survivor.owner === state.currentPlayer && survivor.alive) {
          state.selectedId = survivor.id;
          state.message = `Your surviving ${typeName(survivor.type)} is ready. Choose a highlighted square to move it.`;
        } else {
          state.message = `Player ${state.currentPlayer}, choose a piece to move.`;
        }
      }
      render();
    }

    function getLegalMoves(piece) {
      if (!piece || !piece.alive || piece.owner !== state.currentPlayer) return [];
      const destinations = [[piece.row - 1, piece.col], [piece.row + 1, piece.col], [piece.row, piece.col - 1], [piece.row, piece.col + 1]];
      return destinations.filter(([row, col]) => {
        if (!isInside(row, col)) return false;
        if (isRubbleCell(row, col)) return false;
        const target = pieceAt(row, col);
        return !target || (target.owner !== piece.owner && piece.type !== "flag");
      }).map(([row, col]) => ({ row, col, attack: Boolean(pieceAt(row, col)) && piece.type !== "flag" }));
    }

    function handleSetupCell(row, col) {
      const target = pieceAt(row, col);
      const selected = state.setupSelectedId ? pieceById(state.setupSelectedId) : null;
      if (!selected) {
        if (target && target.owner === state.setupPlayer) {
          state.setupSelectedId = target.id;
          state.message = `${typeName(target.type)} selected. Select another friendly piece to swap, or an empty adjacent square to start the game.`;
        } else if (!target) {
          state.message = "Select one of your pieces first. A move to an empty adjacent square starts the game.";
        }
        render();
        return;
      }
      if (target && target.owner === state.setupPlayer) {
        if (target.id === selected.id) {
          state.setupSelectedId = null;
          state.message = "Selection cleared. Select a piece to swap or move.";
        } else {
          const oldRow = selected.row;
          const oldCol = selected.col;
          selected.row = target.row;
          selected.col = target.col;
          target.row = oldRow;
          target.col = oldCol;
          state.setupSelectedId = null;
          state.message = "Pieces swapped. Select two more pieces to keep arranging, or make a move to start.";
        }
        render();
        return;
      }
      const legal = getLegalMoves(selected).find(move => move.row === row && move.col === col);
      if (!legal) {
        state.message = target && selected.type === "flag" ? "Flags can move, but they cannot attack." : "A move must go to an empty adjacent square or an adjacent enemy.";
        render();
        return;
      }
      state.setupSelectedId = null;
      state.phase = "playing";
      state.message = "The game has started.";
      movePiece(selected, row, col, target);
    }

    function selectPiece(id) {
      const piece = pieceById(id);
      if (!piece || !piece.alive || piece.owner !== state.currentPlayer) return;
      if (state.selectedId === id) {
        state.selectedId = null;
        state.message = "Selection cleared. Choose one of your pieces.";
      } else {
        state.selectedId = id;
        state.message = `${typeName(piece.type)} selected. Choose a highlighted adjacent square. Flags can move but cannot attack.`;
      }
      render();
    }

    function handlePlayingCell(row, col) {
      if (isRubbleCell(row, col)) {
        state.message = "That cell is blocked by rubble for the rest of the game.";
        render();
        return;
      }
      const target = pieceAt(row, col);
      if (target && target.owner === state.currentPlayer) {
        selectPiece(target.id);
        return;
      }
      if (!state.selectedId) {
        state.message = "Select one of your pieces first.";
        render();
        return;
      }
      const selected = pieceById(state.selectedId);
      const legal = getLegalMoves(selected).find(move => move.row === row && move.col === col);
      if (!legal) {
        state.message = selected.type === "flag" ? "Flags can move, but they cannot attack." : "That square is not a legal one-square move.";
        render();
        return;
      }
      movePiece(selected, row, col, target);
    }

    function movePiece(attacker, row, col, defender) {
      state.selectedId = null;
      executeMove(attacker, row, col, defender);
    }

    function executeMove(attacker, row, col, defender) {
      if (defender && attacker.type === "flag") {
        state.message = "Flags can move, but they cannot attack.";
        render();
        return;
      }
      if (!defender) {
        const fromRow = attacker.row;
        const fromCol = attacker.col;
        attacker.row = row; attacker.col = col;
        setMoveAnimation(attacker, fromRow, fromCol, row, col);
        addHistory(`P${attacker.owner} moved a ${typeName(attacker.type)}.`);
        endTurn();
        render();
        return;
      }
      const revealAttacker = !attacker.revealedTo[defender.owner];
      const revealDefender = !defender.revealedTo[attacker.owner];
      attacker.revealedTo[1] = true; attacker.revealedTo[2] = true;
      defender.revealedTo[1] = true; defender.revealedTo[2] = true;
      const combatResult = determineCombat(attacker, defender);
      state.combat = { attackerId: attacker.id, defenderId: defender.id, row, col, fromRow: attacker.row, fromCol: attacker.col, revealAttacker, revealDefender, ...combatResult };
      state.phase = "combat";
      state.message = combatResult.terrainRollSucceeded
        ? `Combat: ${typeName(attacker.type)} versus ${typeName(defender.type)}. Player ${combatResult.terrainOwner}'s high ground prevailed with a ${Math.round(combatResult.terrainChance * 100)}% chance.`
        : `Combat: ${typeName(attacker.type)} versus ${typeName(defender.type)}.`;
      render();
      if (state.gameMode === "computer") {
        computerCombatTimer = setTimeout(() => {
          computerCombatTimer = null;
          if (state.phase === "combat") resolveCombat();
        }, state.combat.outcome === "attacker" || state.combat.outcome === "capture" || state.combat.outcome === "defender" ? 1950 : 1400);
      }
    }

    function setMoveAnimation(piece, fromRow, fromCol, toRow, toCol) {
      state.moveAnimation = { pieceId: piece.id, fromRow, fromCol, toRow, toCol };
      if (moveAnimationTimer) clearTimeout(moveAnimationTimer);
      moveAnimationTimer = setTimeout(() => {
        moveAnimationTimer = null;
        if (state.moveAnimation?.pieceId === piece.id) {
          state.moveAnimation = null;
          render();
        }
      }, 650);
    }

    function resolveCombat() {
      if (!state.combat) return;
      const combat = state.combat;
      const attacker = pieceById(combat.attackerId);
      const defender = pieceById(combat.defenderId);
      if (!attacker || !defender) return;
      if (combat.outcome === "capture") {
        defender.alive = false;
        attacker.row = combat.row; attacker.col = combat.col;
        state.winner = attacker.owner;
        state.phase = "gameover";
        state.combat = null;
        addHistory(`P${attacker.owner} captured the Flag and won.`);
      } else if (combat.outcome === "draw") {
        attacker.alive = false; defender.alive = false;
        attacker.row = attacker.col = defender.row = defender.col = null;
        addRubble(combat.row, combat.col);
        state.lastCombatWinnerId = null;
        addHistory(`${typeName(attacker.type)} met ${typeName(defender.type)} — rubble now blocks this cell.`);
        state.combat = null;
        if (!checkArmyVictory()) endTurn();
      } else if (combat.outcome === "attacker") {
        defender.alive = false;
        attacker.row = combat.row; attacker.col = combat.col;
        state.lastCombatWinnerId = attacker.id;
        addHistory(`P${attacker.owner}'s ${typeName(attacker.type)} defeated ${typeName(defender.type)}.`);
        state.combat = null;
        if (!checkArmyVictory()) endTurn();
      } else {
        attacker.alive = false;
        attacker.row = attacker.col = null;
        defender.row = combat.fromRow; defender.col = combat.fromCol;
        state.lastCombatWinnerId = defender.id;
        addHistory(`P${defender.owner}'s ${typeName(defender.type)} defeated ${typeName(attacker.type)}.`);
        state.combat = null;
        if (!checkArmyVictory()) endTurn();
      }
      render();
    }

    function checkArmyVictory() {
      const playerOnePieces = alivePiecesOf(1);
      const playerTwoPieces = alivePiecesOf(2);
      const playerOneOnlyFlag = playerOnePieces.length === 1 && playerOnePieces[0].type === "flag";
      const playerTwoOnlyFlag = playerTwoPieces.length === 1 && playerTwoPieces[0].type === "flag";
      if (!playerOneOnlyFlag && !playerTwoOnlyFlag) return false;
      if (playerOneOnlyFlag && playerTwoOnlyFlag) {
        state.winner = 0;
        state.message = "Both armies have been reduced to their Flags.";
        addHistory("Both players were left with only a Flag — draw.");
      } else {
        state.winner = playerOneOnlyFlag ? 2 : 1;
        state.message = `Player ${state.winner} wins because the opposing army has only its Flag left.`;
        addHistory(`Player ${state.winner} wins by army elimination.`);
      }
      state.phase = "gameover";
      return true;
    }

    function computerMoveScore(move) {
      const target = pieceAt(move.row, move.col);
      let score = Math.random() * 18;
      if (move.piece.type === "flag") {
        const enemyMobilePieces = alivePiecesOf(1).filter(piece => piece.type !== "flag");
        const isAdjacent = piece => Math.abs(piece.row - move.piece.row) + Math.abs(piece.col - move.piece.col) === 1;
        const destinationThreatened = enemyMobilePieces.some(piece => Math.abs(piece.row - move.row) + Math.abs(piece.col - move.col) === 1);
        const currentlyThreatened = enemyMobilePieces.some(isAdjacent);
        const nearestEnemyDistance = enemyMobilePieces.length
          ? Math.min(...enemyMobilePieces.map(piece => Math.abs(piece.row - move.row) + Math.abs(piece.col - move.col)))
          : BOARD_ROWS + BOARD_COLS;
        if (currentlyThreatened) score += 780;
        if (destinationThreatened) score -= 620;
        score += Math.min(nearestEnemyDistance, 6) * 55;
        score += Math.random() * 160;
        return score;
      }
      if (target) {
        const terrainEdge = target.type === "flag" ? null : terrainAdvantage(move.piece, target);
        if (terrainEdge) score += (terrainEdge.owner === state.aiPlayer ? 1 : -1) * terrainEdge.chance * 420;
        if (target.revealedTo[state.aiPlayer]) {
          if (target.type === "flag") return 10000;
          if (beats[move.piece.type] === target.type) score += 620;
          else if (move.piece.type === target.type) score += 45;
          else score -= 720;
        } else {
          score += 500;
        }
      } else {
        score += move.row * 32;
        if (move.row >= 2) score += 22;
      }
      const enemyFlag = alivePiecesOf(1).find(piece => piece.type === "flag" && piece.revealedTo[state.aiPlayer]);
      if (enemyFlag && Math.abs(move.row - enemyFlag.row) + Math.abs(move.col - enemyFlag.col) <= 1) score += 180;
      return score;
    }

    function chooseComputerMove() {
      let moves = alivePiecesOf(state.aiPlayer)
        .flatMap(piece => getLegalMoves(piece).map(destination => ({ piece, row: destination.row, col: destination.col })));
      if (!moves.length) return null;
      const flag = alivePiecesOf(state.aiPlayer).find(piece => piece.type === "flag");
      const enemyMobilePieces = alivePiecesOf(opponent(state.aiPlayer)).filter(piece => piece.type !== "flag");
      const flagThreatened = flag && enemyMobilePieces.some(piece => Math.abs(piece.row - flag.row) + Math.abs(piece.col - flag.col) === 1);
      const flagMoves = moves.filter(move => move.piece.type === "flag");
      const nonFlagMoves = moves.filter(move => move.piece.type !== "flag");
      if (flagMoves.length && nonFlagMoves.length && !flagThreatened) {
        moves = Math.random() < 0.05 ? flagMoves : nonFlagMoves;
      } else if (nonFlagMoves.length && !flagMoves.length) {
        moves = nonFlagMoves;
      }
      let bestMove = moves[0];
      let bestScore = computerMoveScore(bestMove);
      moves.slice(1).forEach(move => {
        const score = computerMoveScore(move);
        if (score > bestScore) {
          bestMove = move;
          bestScore = score;
        }
      });
      return bestMove;
    }

    function runComputerTurn() {
      if (state.phase !== "ai-thinking" || state.currentPlayer !== state.aiPlayer) return;
      state.phase = "playing";
      const move = chooseComputerMove();
      if (!move) {
        endTurn();
        render();
        return;
      }
      executeMove(move.piece, move.row, move.col, pieceAt(move.row, move.col));
    }

    function endTurn() {
      state.turnNumber += 1;
      state.currentPlayer = opponent(state.currentPlayer);
      state.selectedId = null;
      if (state.gameMode === "computer" && state.currentPlayer === state.aiPlayer) {
        state.phase = "ai-thinking";
        state.message = "Player 2's move.";
        render();
        setTimeout(runComputerTurn, 850);
        return;
      }
      if (state.gameMode === "computer") {
        state.phase = "playing";
        state.message = "Your turn. Choose a piece to move. Flags can move but cannot attack.";
        return;
      }
      state.phase = "turn-pass";
      state.message = `Player ${opponent(state.currentPlayer)} turn complete.`;
    }

    function addHistory(text) {
      state.history.unshift(text);
      if (state.history.length > 8) state.history.pop();
    }

    function renderPiece(piece, viewer, context = "board") {
      const isOwn = piece.owner === viewer;
      const isKnown = piece.revealedTo[viewer];
      const isCombatPair = context === "combat-board" && state.combat && [state.combat.attackerId, state.combat.defenderId].includes(piece.id);
      const hidden = context === "combat-board" ? !isCombatPair && !isKnown && !(state.gameMode === "computer" && isOwn) : context !== "deployment" && !isOwn && !isKnown;
      const visibleType = hidden ? null : piece.type;
      const typeClass = visibleType || "hidden";
      const glyph = visibleType ? TYPE_META[visibleType].glyph : "?";
      const label = visibleType ? TYPE_META[visibleType].short : "?";
      const knownToComputer = state.gameMode === "computer" && piece.owner === 1 && piece.revealedTo[state.aiPlayer];
      const knownClass = (!isOwn && isKnown) || knownToComputer ? " known" : "";
      const selectedClass = state.phase === "setup" && state.setupSelectedId === piece.id ? " setup-selected" : "";
      const ownerClass = piece.owner === 1 ? "owner-p1" : "owner-p2";
      const artwork = visibleType ? `<img class="piece-art" src="${pieceAsset(piece)}" alt="">` : `<span class="piece-glyph">${glyph}</span>`;
      const shouldReveal = (state.combat?.revealAttacker && piece.id === state.combat.attackerId) || (state.combat?.revealDefender && piece.id === state.combat.defenderId);
      const revealClass = shouldReveal && (context === "combat-board" || context === "combat") ? " reveal-turn" : "";
      let combatClass = "";
      let combatStyle = "";
      let moveClass = "";
      let moveStyle = "";
      if (context === "board" && state.moveAnimation?.pieceId === piece.id) {
        moveClass = " move-arrival";
        moveStyle = ` style="--move-x:${state.moveAnimation.fromCol - state.moveAnimation.toCol};--move-y:${state.moveAnimation.fromRow - state.moveAnimation.toRow};"`;
      }
      if (context === "combat-board" && state.combat && [state.combat.attackerId, state.combat.defenderId].includes(piece.id)) {
        if (state.combat.outcome === "draw") {
          combatClass = " combat-draw";
        } else if (state.combat.outcome === "capture" && piece.id === state.combat.defenderId) {
          combatClass = " capture-flag-piece";
        } else if ((state.combat.outcome === "attacker" || state.combat.outcome === "capture") && piece.id === state.combat.attackerId) {
          combatClass = " combat-winner";
          combatStyle = ` style="--combat-x:${state.combat.col - piece.col};--combat-y:${state.combat.row - piece.row};"`;
        } else if (state.combat.outcome === "defender" && piece.id === state.combat.defenderId) {
          combatClass = " combat-winner";
          combatStyle = ` style="--combat-x:${state.combat.fromCol - piece.col};--combat-y:${state.combat.fromRow - piece.row};"`;
        } else {
          combatClass = " combat-loser";
        }
      }
      const pieceStyle = combatStyle || moveStyle;
      return `<div class="piece ${typeClass} ${ownerClass}${knownClass}${selectedClass}${combatClass}${moveClass}${revealClass}"${pieceStyle} aria-label="${hidden ? `Hidden Player ${piece.owner} piece` : `${typeName(piece.type)} belonging to Player ${piece.owner}`}" title="${hidden ? `Hidden Player ${piece.owner} piece` : typeName(piece.type)}">${artwork}<span class="piece-label">${label}</span></div>`;
    }

    function displayCoordinates(viewer) {
      const rows = viewer === 1 ? [0, 1, 2, 3, 4, 5] : [5, 4, 3, 2, 1, 0];
      const cols = viewer === 1 ? [0, 1, 2, 3] : [3, 2, 1, 0];
      return { rows, cols };
    }

    function renderBattleBurst(variant = "", style = "", flagAsset = "") {
      const rays = ["a", "b", "c", "d", "e", "f", "g", "h"].map(ray => `<span class="burst-ray ray-${ray}"></span>`).join("");
      const orbs = ["a", "b", "c", "d"].map(orb => `<span class="burst-orb orb-${orb}"></span>`).join("");
      const shards = ["a", "b", "c", "d", "e", "f"].map(shard => `<span class="burst-shard shard-${shard}"></span>`).join("");
      const capturedFlag = flagAsset ? `<img class="capture-flag-art" src="${flagAsset}" alt="Captured Flag">` : "";
      return `<span class="battle-burst ${variant}"${style ? ` style="${style}"` : ""} aria-hidden="true"><span class="burst-flash"></span><span class="burst-ring ring-a"></span><span class="burst-ring ring-b"></span><span class="burst-core"></span>${capturedFlag}${rays}${orbs}${shards}</span>`;
    }

    function renderBoardBurst() {
      if (!state.combat) return "";
      const attacker = pieceById(state.combat.attackerId);
      const defender = pieceById(state.combat.defenderId);
      if (!attacker || !defender) return "";
      const centerX = ((attacker.col + defender.col + 1) / (BOARD_COLS * 2)) * 100;
      const centerY = ((attacker.row + defender.row + 1) / (BOARD_ROWS * 2)) * 100;
      const variant = state.combat.outcome === "capture" ? " capture" : "";
      const flagAsset = state.combat.outcome === "capture" ? pieceAsset(defender) : "";
      return renderBattleBurst(`battle-burst-overlay${variant}`, `--burst-board-x:${centerX}%;--burst-board-y:${centerY}%;`, flagAsset);
    }

    function terrainCornerRadii(mask) {
      const radius = 14;
      return {
        tl: mask & 1 || mask & 8 ? 0 : radius,
        tr: mask & 1 || mask & 2 ? 0 : radius,
        br: mask & 4 || mask & 2 ? 0 : radius,
        bl: mask & 4 || mask & 8 ? 0 : radius
      };
    }

    function terrainTilePath(row, col, mask) {
      const x = col * 100;
      const y = row * 100;
      const { tl, tr, br, bl } = terrainCornerRadii(mask);
      return `M ${x + tl} ${y} H ${x + 100 - tr} Q ${x + 100} ${y} ${x + 100} ${y + tr} V ${y + 100 - br} Q ${x + 100} ${y + 100} ${x + 100 - br} ${y + 100} H ${x + bl} Q ${x} ${y + 100} ${x} ${y + 100 - bl} V ${y + tl} Q ${x} ${y} ${x + tl} ${y} Z`;
    }

    function terrainEdgePaths(row, col, mask) {
      const x = col * 100;
      const y = row * 100;
      const { tl, tr, br, bl } = terrainCornerRadii(mask);
      const paths = [];
      if (!(mask & 1)) paths.push(`M ${x + tl} ${y} H ${x + 100 - tr}`);
      if (!(mask & 2)) paths.push(`M ${x + 100} ${y + tr} V ${y + 100 - br}`);
      if (!(mask & 4)) paths.push(`M ${x + 100 - br} ${y + 100} H ${x + bl}`);
      if (!(mask & 8)) paths.push(`M ${x} ${y + 100 - bl} V ${y + tl}`);
      return paths;
    }

    function renderTerrainLayer() {
      if (!state.highGroundCells.length) return "";
      const tilePaths = [];
      const edgePaths = [];
      state.highGroundCells.forEach(key => {
        const [row, col] = key.split("-").map(Number);
        const mask = terrainMask(row, col);
        tilePaths.push(`<path d="${terrainTilePath(row, col, mask)}"></path>`);
        terrainEdgePaths(row, col, mask).forEach(path => edgePaths.push(`<path d="${path}"></path>`));
      });
      return `<div class="terrain-layer" aria-hidden="true"><svg viewBox="0 0 400 600" preserveAspectRatio="none"><defs><clipPath id="terrain-shape" clipPathUnits="userSpaceOnUse">${tilePaths.join("")}</clipPath></defs><image href="assets/high-ground-1111.png" x="0" y="0" width="400" height="600" preserveAspectRatio="none" clip-path="url(#terrain-shape)"></image><g class="terrain-edge-shadow">${edgePaths.join("")}</g><g class="terrain-edge-highlight" transform="translate(0 -2)">${edgePaths.join("")}</g></svg></div>`;
    }

    function renderBoard(viewer, context = "board") {
      const { rows, cols } = displayCoordinates(viewer);
      const selected = state.selectedId ? pieceById(state.selectedId) : null;
      const legalMoves = selected && state.phase === "playing" ? getLegalMoves(selected) : [];
      const legalMap = new Map(legalMoves.map(move => [`${move.row}-${move.col}`, move]));
      let html = "";
      rows.forEach(row => cols.forEach(col => {
        const piece = pieceAt(row, col);
        const classes = ["cell"];
        const terrainPhase = state.phase === "terrain-setup" || state.phase === "terrain-ai-thinking";
        const highGround = isHighGroundCell(row, col);
        const rubble = isRubbleCell(row, col);
        if (terrainPhase) classes.push("terrain-cell");
        if (highGround) classes.push("high-ground");
        if (rubble) classes.push("rubble");
        if (isHomeSquare(1, row)) classes.push("zone-p1");
        if (isHomeSquare(2, row)) classes.push("zone-p2");
        if (isHomeSquare(viewer, row)) classes.push("own-zone");
        else if (isHomeSquare(opponent(viewer), row)) classes.push("opponent-zone");
        else classes.push("neutral");
        if (selected && selected.row === row && selected.col === col) classes.push("selected");
        const legal = legalMap.get(`${row}-${col}`);
        if (legal) classes.push(legal.attack ? "legal-attack" : "legal-move");
        if (context === "combat-board" && state.combat && piece && [state.combat.attackerId, state.combat.defenderId].includes(piece.id)) {
          const isAttacker = piece.id === state.combat.attackerId;
          classes.push(isAttacker ? "combat-attacker" : "combat-defender");
          if (state.combat.outcome === "draw") classes.push("combat-draw");
          else if ((state.combat.outcome === "attacker" || state.combat.outcome === "capture") === isAttacker || (state.combat.outcome === "defender" && !isAttacker)) classes.push("combat-winner");
          else classes.push("combat-loser");
        }
        if (piece && state.moveAnimation?.pieceId === piece.id && context === "board") classes.push("move-arrival-cell");
        const terrainLabel = highGround ? "High-ground" : "Plain";
        const label = rubble ? `Forbidden rubble cell at row ${row + 1}, column ${col + 1}` : piece ? `${hiddenPieceLabel(piece, viewer, context)} on ${terrainLabel.toLowerCase()} terrain at row ${row + 1}, column ${col + 1}` : `${terrainLabel} terrain tile at row ${row + 1}, column ${col + 1}`;
        const contents = `${terrainMarkup(row, col)}${rubble ? `<img class="rubble-art" src="assets/forbidden-rubble.png" alt="">` : piece ? renderPiece(piece, viewer, context) : ""}`;
        html += `<button class="${classes.join(" ")}" data-row="${row}" data-col="${col}" aria-label="${label}">${contents}</button>`;
      }));
      return html;
    }

    function hiddenPieceLabel(piece, viewer, context = "board") {
      if (context === "combat-board" && ![state.combat?.attackerId, state.combat?.defenderId].includes(piece.id) && !(state.gameMode === "computer" && piece.owner === viewer)) return "Hidden piece";
      if (piece.owner === viewer || piece.revealedTo[viewer]) return `Player ${piece.owner}'s ${typeName(piece.type)}`;
      return `Hidden Player ${piece.owner} piece`;
    }

    function remainingMarkup(owner, viewer) {
      const alive = alivePiecesOf(owner);
      if (owner !== viewer) {
        return `<div class="inventory-row"><span class="inventory-name"><span class="mini-symbol hidden">?</span>Hidden army</span><strong>${alive.length}</strong></div>`;
      }
      return TYPES.map(type => {
        const count = alive.filter(piece => piece.type === type).length;
        return `<div class="inventory-row"><span class="inventory-name"><span class="mini-symbol ${type}">${TYPE_META[type].short}</span>${typeName(type)}</span><strong>${count}</strong></div>`;
      }).join("");
    }

    function currentStatus() {
      if (state.phase === "setup") return "Random setup";
      if (state.phase === "terrain-setup") return `Terrain setup · Player ${state.terrainPlayer}`;
      if (state.phase === "terrain-ai-thinking") return "Terrain setup · Player 2 choosing";
      if (state.phase === "playing") return `Player ${state.currentPlayer} turn`;
      if (state.phase === "combat") return "Combat reveal";
      if (state.phase === "gameover") return "Game complete";
      return "Pass device";
    }

    function render() {
      const aiIsActive = state.gameMode === "computer" && state.currentPlayer === state.aiPlayer;
      const viewer = aiIsActive ? 1 : state.phase === "setup" ? state.setupPlayer : state.currentPlayer;
      const captureCombat = state.phase === "combat" && state.combat?.outcome === "capture";
      const terrainPhase = state.phase === "terrain-setup" || state.phase === "terrain-ai-thinking";
      const phaseLine = terrainPhase
        ? state.phase === "terrain-ai-thinking"
          ? "Terrain setup · Player 2 is choosing high ground"
          : `Terrain setup · Player ${state.terrainPlayer}: tap a tile to toggle high ground · click outside the board to begin random formations`
        : currentStatus();
      app.innerHTML = `
        <header class="topbar">
          <div class="brand"><div class="brand-mark" aria-hidden="true"><span>RPS</span></div><div class="brand-copy"><p class="eyebrow">Pass &amp; play tactics</p><h1>Rock Paper Scissors <span>Stratego</span></h1><p class="phase-line" aria-live="polite">${phaseLine}</p></div></div>
          <nav class="top-actions" aria-label="Game controls"><button class="icon-button rules-button" data-action="rules" aria-label="Rules" title="Rules"><span aria-hidden="true">?</span></button><button class="icon-button new-button" data-action="new" aria-label="New game" title="New game"><span aria-hidden="true">↻</span></button></nav>
        </header>
        <main class="game-layout">
          <section class="board-column" aria-label="Game board"><div class="board-frame"><div class="board ${state.phase === "combat" ? "combat-board" : ""}${captureCombat ? " capture-board" : ""}" role="grid" aria-label="4 by 6 Rock Paper Scissors Stratego board">${renderTerrainLayer()}${renderBoard(viewer, state.phase === "combat" ? "combat-board" : "board")}${state.phase === "combat" && state.gameMode === "computer" ? renderBoardBurst() : ""}</div></div></section>
        </main>
        ${renderOverlay()}
        ${state.phase === "combat" && state.gameMode !== "computer" ? renderCombatModal() : ""}
        ${rulesOpen ? renderRulesModal() : ""}`;
      bindEvents();
    }

    let rulesOpen = false;
    let computerCombatTimer = null;
    let moveAnimationTimer = null;
    let terrainComputerTimer = null;

    function renderOverlay() {
      if (state.phase === "mode-select") return `<div class="overlay"><section class="pass-card mode-select-card"><div class="pass-icon" aria-hidden="true"><span>RPS</span></div><p class="eyebrow">Choose your table</p><h2>How will you play?</h2><p>Keep the classic private handoff, or let the computer command Player 2.</p><div class="mode-actions"><button class="primary-button" data-action="choose-mode" data-mode="computer">Play vs computer</button><button class="secondary-button" data-action="choose-mode" data-mode="local">Pass &amp; play</button></div></section></div>`;
      if (state.phase === "ai-thinking") return "";
      const overlayPhases = ["turn-pass", "gameover"];
      if (!overlayPhases.includes(state.phase)) return "";
      if (state.phase === "gameover") return `<div class="overlay"><section class="pass-card"><div class="pass-icon">⚑</div><p class="winner">${state.winner === 0 ? "Stalemate" : "Victory"}</p><h2>${state.winner === 0 ? "Draw" : `Player ${state.winner} Wins`}</h2><p>${state.winner === 0 ? "Both armies were reduced to their Flags." : state.message || "The opposing army has fallen."}</p><button class="primary-button" data-action="new">Play again</button></section></div>`;
      const nextPlayer = state.currentPlayer;
      return `<div class="overlay"><section class="pass-card"><div class="pass-icon" aria-hidden="true">⇄</div><p class="eyebrow">Private handoff</p><h2>Pass the device to Player ${nextPlayer}</h2><p>Player ${opponent(nextPlayer)}'s turn is complete. Hand over the device, then reveal your side when ready.</p><button class="primary-button" data-action="begin-pass">Start Player ${nextPlayer} turn</button></section></div>`;
    }

    function combatDetails() {
      const attacker = pieceById(state.combat.attackerId);
      const defender = pieceById(state.combat.defenderId);
      const terrainNote = state.combat.terrainOwner
        ? state.combat.terrainRollSucceeded
          ? ` — high ground prevailed (${Math.round(state.combat.terrainChance * 100)}% chance)`
          : ` — high-ground roll missed (${Math.round(state.combat.terrainChance * 100)}% chance)`
        : "";
      let title = "Combat resolved";
      let result = "";
      if (state.combat.outcome === "capture") { title = "Flag captured"; result = `${typeName(attacker.type)} captures the Flag`; }
      else if (state.combat.outcome === "draw") { title = "Rubble formed"; result = `${typeName(attacker.type)} meets ${typeName(defender.type)} — this cell is forbidden for the rest of the game${terrainNote}`; }
      else if (state.combat.outcome === "attacker") { title = `${typeName(attacker.type)} wins`; result = `${typeName(attacker.type)} defeats ${typeName(defender.type)}${terrainNote}`; }
      else { title = `${typeName(defender.type)} wins`; result = `${typeName(defender.type)} defeats ${typeName(attacker.type)}${terrainNote}`; }
      return { attacker, defender, title, result };
    }

    function renderCombatModal() {
      const { attacker, defender, title, result } = combatDetails();
      const outcomeClass = state.combat.outcome === "draw" ? "draw" : state.combat.outcome === "defender" ? "defender-wins" : "attacker-wins";
      const attackerClass = state.combat.outcome === "draw" ? "" : state.combat.outcome === "attacker" || state.combat.outcome === "capture" ? "winner" : "loser";
      const defenderClass = state.combat.outcome === "draw" || state.combat.outcome === "capture" ? "" : state.combat.outcome === "defender" ? "winner" : "loser";
      const burstVariant = state.combat.outcome === "capture" ? " capture" : "";
      const flagAsset = state.combat.outcome === "capture" ? pieceAsset(defender) : "";
      return `<div class="overlay combat-overlay"><section class="pass-card combat-card"><p class="eyebrow">Public battle · field visible</p><h2>${title}</h2><div class="combatants ${outcomeClass}" aria-live="polite"><div class="combatant attacker ${attackerClass}">${renderPiece(attacker, attacker.owner, "combat")}</div><div class="versus">${state.combat.outcome === "draw" ? "TIE" : "VS"}</div><div class="combatant defender ${defenderClass}">${renderPiece(defender, defender.owner, "combat")}</div>${renderBattleBurst(`battle-burst-modal${burstVariant}`, "", flagAsset)}</div><p class="combat-result">${result} <span>· The result resolves on the field.</span></p><button class="primary-button" data-action="continue-combat">Continue</button></section></div>`;
    }

    function renderInlineCombat() {
      const { result } = combatDetails();
      return `<div class="message-box combat-inline-message" aria-live="polite"><strong>Battle in progress</strong><span class="combat-inline-result">${result}</span><span class="combat-inline-note">The result is resolving on the field.</span></div>`;
    }

    function renderRulesModal() {
      return `<div class="modal-backdrop" data-action="close-rules"><section class="rules-modal" role="dialog" aria-modal="true" aria-labelledby="rules-title" onclick="event.stopPropagation()"><div class="modal-heading"><div><p class="panel-label">How to play</p><h2 id="rules-title">Rules of the arena</h2></div><button class="close-button" data-action="close-rules" aria-label="Close rules">×</button></div><h3>Goal</h3><p>Capture the opponent's Flag. Player 1 moves first.</p><h3>Army</h3><ul><li>2 Rock, 2 Paper, 2 Scissors, and 1 Flag.</li><li>1 secret extra Rock, Paper, or Scissors, selected at random.</li></ul><h3>Terrain setup</h3><p>Players alternate toggling any board tile between plain and high ground. Each toggle uses the current terrain turn. Click outside the board when ready to begin random army placement. Connected high-ground tiles form one public component and share seamless edges.</p><h3>Movement</h3><p>Move any piece one square orthogonally. Pieces cannot move diagonally, jump, land on a friendly piece, or enter a rubble cell. Flags can move but cannot attack.</p><h3>Combat</h3><ul><li>Rock beats Scissors.</li><li>Scissors beats Paper.</li><li>Paper beats Rock.</li><li>When exactly one combatant is on high ground, its component gives it a 20% chance per tile to override the normal result, capped at 80%.</li><li>A failed high-ground roll falls through to normal RPS logic, including a draw for matching pieces.</li><li>Matching pieces become rubble, and their cell is forbidden for the rest of the game.</li><li>Any non-Flag piece captures the Flag immediately.</li><li>An army reduced to only its Flag loses immediately.</li></ul><h3>Hidden information</h3><p>Enemy pieces are hidden until combat reveals them. A revealed enemy that survives stays known for the rest of the game. Keep the screen covered during each pass-device handoff.</p></section></div>`;
    }

    function bindEvents() {
      app.querySelectorAll("[data-row][data-col]").forEach(cell => cell.addEventListener("click", () => {
        const row = Number(cell.dataset.row); const col = Number(cell.dataset.col);
        if (state.phase === "terrain-setup") handleTerrainCell(row, col);
        else if (state.phase === "setup") handleSetupCell(row, col);
        else if (state.phase === "playing") handlePlayingCell(row, col);
      }));
      app.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => handleAction("choose-mode", button.dataset.mode)));
      app.querySelectorAll("[data-action]:not([data-mode])").forEach(button => button.addEventListener("click", () => handleAction(button.dataset.action)));
    }

    function handleAction(action, mode) {
      if (action === "new") { initializeGame(); return; }
      if (action === "choose-mode") { chooseGameMode(mode); return; }
      if (action === "rules") { rulesOpen = true; render(); return; }
      if (action === "close-rules") { rulesOpen = false; render(); return; }
      if (action === "begin-pass") { beginPass(); return; }
      if (action === "continue-combat") { resolveCombat(); return; }
    }

    document.addEventListener("click", event => {
      if (state?.phase !== "terrain-setup") return;
      const target = event.target;
      if (target.closest?.(".board-frame") || target.closest?.(".topbar") || target.closest?.(".phase-banner") || target.closest?.("[data-action]") || target.closest?.(".overlay") || target.closest?.(".modal-backdrop")) return;
      finishTerrainSetup();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && rulesOpen) { rulesOpen = false; render(); }
    });

    initializeGame();
  </script>
</body>
</html>
